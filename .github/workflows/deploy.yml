name: Deploy to rubenv.net/tools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build
        run: |
          install() {
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          }
          if [ -f package.json ] && grep -q '"vite"' package.json; then
            install
            # Served from /tools/meridian/: give a bare React Router that basename.
            if [ -f src/App.tsx ] && grep -q '<BrowserRouter>' src/App.tsx; then
              sed -i 's|<BrowserRouter>|<BrowserRouter basename="/tools/meridian">|' src/App.tsx
            fi
            npx vite build --base=/tools/meridian/
          elif [ -f package.json ] && node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            install
            npm run build
          else
            mkdir -p dist
            rsync -a --exclude=.git --exclude=.github --exclude=node_modules --exclude=dist --exclude=serve.json ./ dist/
          fi
          test -f dist/index.html

      - name: Upload to the server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "dist"
          target: "/var/www/rubenv.net/htdocs/tools/meridian"
          strip_components: 1
          overwrite: true

      - name: Set permissions
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            chown -R www-data:www-data /var/www/rubenv.net/htdocs/tools/meridian
            chmod -R u=rwX,go=rX /var/www/rubenv.net/htdocs/tools/meridian
